name: Resumo semanal (domingo 7h)

# Envia o resumo da PRÓXIMA semana com os pratos monitorados encontrados.
# Cron do GitHub Actions roda em UTC. São Paulo = UTC-3.
# Domingo 07:00 em São Paulo = domingo 10:00 UTC.
# Usamos minuto quebrado (10:17) de propósito: horários "cheios" (hora redonda)
# são os mais concorridos no GitHub e os que mais atrasam/pulam.
# (dia 0 = domingo no cron do GitHub)
on:
  schedule:
    - cron: "17 10 * * 0"
  workflow_dispatch: {}   # permite rodar manualmente pelo botão "Run workflow"

jobs:
  resumo:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install -e .

      - name: Enviar resumo da semana
        env:
          PYTHONPATH: .
          TZ: America/Sao_Paulo
          BUSCA_SMTP_USER: ${{ secrets.BUSCA_SMTP_USER }}
          BUSCA_SMTP_PASSWORD: ${{ secrets.BUSCA_SMTP_PASSWORD }}
        run: python robo.py resumo
